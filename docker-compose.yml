services:

  db:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: 
      - sh
      - -c
      - python -m app.database.create_tables && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: